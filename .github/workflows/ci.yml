name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Marker and formatting regressions
        run: sh scripts/test.sh --markers-only

      - name: Smoke test
        run: sh scripts/test.sh

      - name: Build jar
        run: sh scripts/build.sh

      - name: Create checksum
        working-directory: build
        run: sha256sum payload-runner-burp.jar > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-runner-burp
          path: |
            build/payload-runner-burp.jar
            build/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=$(mktemp)
            printf 'Automated release for %s.\n' "$GITHUB_REF_NAME" > "$notes_file"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "build/payload-runner-burp.jar#payload-runner-burp.jar" \
              "build/SHA256SUMS.txt#SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Payload Runner $GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              "build/payload-runner-burp.jar#payload-runner-burp.jar" \
              "build/SHA256SUMS.txt#SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Payload Runner $GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
